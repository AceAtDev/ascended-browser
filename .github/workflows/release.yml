# Publishes to PyPI and npm when a GitHub release is published.
# Both use trusted publishing (no token stored anywhere): the PyPI project and
# the npm package each trust this repository's `release.yml` workflow.
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The tag matches both package versions
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "$(node -p 'require("./npm/package.json").version')" = "${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # After PyPI, so the launcher never points at a version that is not there yet.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: cp README.md LICENSE npm/
      - run: npm publish --access public --provenance
        working-directory: npm
